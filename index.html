<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <!-- Include other necessary head elements here -->
</head>
<body>
    <h1>Welcome to My Personal Website!</h1>
    <div id="ad-container">
        <!-- AdSense ads will be inserted here -->
    </div>

    <script>
        // Initialize ads
        window.adsbygoogle = window.adsbygoogle || [];

        function showAds() {
            var adContainer = document.getElementById('ad-container');
            var containerWidth = adContainer.offsetWidth;
            var containerHeight = adContainer.offsetHeight;

            if (containerWidth > 0 && containerHeight > 0) {
                try {
                    adsbygoogle.push({ /* Ad configuration */ });
                } catch (error) {
                    console.error('AdSense error:', error);
                }
            } else {
                console.error('Ad container dimensions are invalid. Width and height must be greater than zero.');
            }
        }

        // Call the function to show ads
        showAds();
    </script>
</body>
</html>
