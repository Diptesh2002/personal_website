<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Diptesh Panda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #F5F5F5;
            --color-surface: #FFFFFF;
            --color-text: #1A1A1A;
            --color-accent: #333333;
            --color-secondary: #666666;
            --color-border: #E0E0E0;
            --color-success: #4CAF50;
            --color-danger: #F44336;
            --color-warning: #FF9800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--color-accent);
            color: #0A0A0A;
        }

        .btn-primary:hover {
            background: #FFFFFF;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--color-surface);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover {
            border-color: var(--color-accent);
        }

        .btn-danger {
            background: var(--color-danger);
            color: white;
        }

        .btn-danger:hover {
            background: #D32F2F;
        }

        .btn-success {
            background: var(--color-success);
            color: white;
        }

        .btn-success:hover {
            background: #45A049;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .sidebar {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1.5rem;
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--color-accent);
        }

        .article-list {
            list-style: none;
        }

        .article-item {
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .article-item:hover {
            border-color: var(--color-accent);
            transform: translateX(4px);
        }

        .article-item.active {
            border-color: var(--color-accent);
            background: rgba(232, 232, 232, 0.05);
        }

        .article-item-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
        }

        .article-item-meta {
            font-size: 0.8rem;
            color: var(--color-secondary);
        }

        .editor-section {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-accent);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            color: var(--color-text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .form-group textarea {
            min-height: 400px;
            resize: vertical;
            font-family: monospace;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
        }

        .editor-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--color-border);
        }

        .preview-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--color-border);
        }

        .preview-section h3 {
            margin-bottom: 1rem;
            color: var(--color-accent);
        }

        .preview-content {
            background: var(--color-bg);
            padding: 2rem;
            border: 1px solid var(--color-border);
            border-radius: 4px;
        }

        .preview-content h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .preview-content p {
            color: var(--color-secondary);
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            border-left: 4px solid;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.1);
            border-color: var(--color-success);
            color: var(--color-success);
        }

        .alert-danger {
            background: rgba(244, 67, 54, 0.1);
            border-color: var(--color-danger);
            color: var(--color-danger);
        }

        .alert-info {
            background: rgba(232, 232, 232, 0.1);
            border-color: var(--color-accent);
            color: var(--color-accent);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--color-secondary);
        }

        .empty-state h3 {
            margin-bottom: 1rem;
            color: var(--color-text);
        }

        .helper-text {
            font-size: 0.85rem;
            color: var(--color-secondary);
            margin-top: 0.25rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-accent);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--color-secondary);
            margin-top: 0.5rem;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>📝 Admin Panel - Diptesh Panda</h1>
        <div class="header-actions">
            <a href="index.html" class="btn btn-secondary" target="_blank">View Website</a>
            <button class="btn btn-primary" onclick="showNewArticleForm()">+ New Article</button>
        </div>
    </header>

    <div class="container">
        <div id="alertContainer"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalArticles">0</div>
                <div class="stat-label">Total Articles</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalComments">0</div>
                <div class="stat-label">Total Comments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="recentViews">-</div>
                <div class="stat-label">Status</div>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h2>All Articles</h2>
                <div id="articleList" class="article-list">
                    <div class="loading">Loading articles...</div>
                </div>
            </div>

            <div class="editor-section">
                <div id="editorContent">
                    <div class="empty-state">
                        <h3>Welcome to Your Admin Panel!</h3>
                        <p>Click "+ New Article" to create your first article, or select an existing article from the sidebar to edit it.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA3MeWwfna1V72kv2i3qZk8yA6g_yDe4eg",
            authDomain: "personalwebsite-42d10.firebaseapp.com",
            projectId: "personalwebsite-42d10",
            storageBucket: "personalwebsite-42d10.firebasestorage.app",
            messagingSenderId: "540243886843",
            appId: "1:540243886843:web:7989097f99a1255b7fe65e",
            measurementId: "G-SZFYV88R8S"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentArticleId = null;

        // Show alert message
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Load all articles
        function loadArticles() {
            db.collection('articles')
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    const articleList = document.getElementById('articleList');
                    
                    if (snapshot.empty) {
                        articleList.innerHTML = '<div class="empty-state"><p>No articles yet. Create your first one!</p></div>';
                        document.getElementById('totalArticles').textContent = '0';
                        return;
                    }

                    articleList.innerHTML = '';
                    let count = 0;

                    snapshot.forEach(doc => {
                        const article = doc.data();
                        count++;

                        const item = document.createElement('div');
                        item.className = 'article-item';
                        item.onclick = () => editArticle(doc.id);
                        item.innerHTML = `
                            <div class="article-item-title">${article.title}</div>
                            <div class="article-item-meta">${article.category} • ${article.date}</div>
                        `;
                        articleList.appendChild(item);
                    });

                    document.getElementById('totalArticles').textContent = count;
                })
                .catch((error) => {
                    console.error('Error loading articles:', error);
                    showAlert('Error loading articles: ' + error.message, 'danger');
                });

            // Load total comments
            db.collection('comments')
                .get()
                .then((snapshot) => {
                    document.getElementById('totalComments').textContent = snapshot.size;
                })
                .catch((error) => {
                    console.error('Error loading comments:', error);
                });
        }

        // Show new article form
        function showNewArticleForm() {
            currentArticleId = null;
            const editorContent = document.getElementById('editorContent');
            
            editorContent.innerHTML = `
                <h2>Create New Article</h2>
                <form id="articleForm" onsubmit="saveArticle(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="articleId">Article ID *</label>
                            <input type="text" id="articleId" required placeholder="e.g., my-first-article">
                            <div class="helper-text">Use lowercase, hyphens only (e.g., my-article-title)</div>
                        </div>
                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" required>
                                <option value="">Select category</option>
                                <option value="playwright">Playwright & Test Automation</option>
                                <option value="history">Ancient History Insights</option>
                                <option value="politics">Politics & Finance</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="readTime">Read Time *</label>
                            <input type="text" id="readTime" required placeholder="e.g., 5 min read">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="title">Article Title *</label>
                        <input type="text" id="title" required placeholder="Enter article title">
                    </div>

                    <div class="form-group">
                        <label for="excerpt">Excerpt (Short Description) *</label>
                        <textarea id="excerpt" rows="3" required placeholder="Write a brief 1-2 sentence description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="content">Article Content (HTML) *</label>
                        <textarea id="content" required placeholder="Write your article content using HTML...

Example:
<p>Your first paragraph here...</p>
<p><strong>Bold text</strong> and regular text.</p>
<p>Another paragraph with your content.</p>"></textarea>
                        <div class="helper-text">
                            Use HTML tags: &lt;p&gt; for paragraphs, &lt;strong&gt; for bold, &lt;em&gt; for italic
                        </div>
                    </div>

                    <div class="editor-actions">
                        <button type="button" class="btn btn-secondary" onclick="previewArticle()">Preview</button>
                        <button type="button" class="btn btn-danger" onclick="clearForm()">Clear</button>
                        <button type="submit" class="btn btn-success">Publish Article</button>
                    </div>
                </form>

                <div id="previewSection" class="preview-section" style="display: none;">
                    <h3>Preview</h3>
                    <div class="preview-content" id="previewContent"></div>
                </div>
            `;
        }

        // Edit existing article
        function editArticle(articleId) {
            currentArticleId = articleId;
            
            db.collection('articles').doc(articleId).get()
                .then((doc) => {
                    if (!doc.exists) {
                        showAlert('Article not found!', 'danger');
                        return;
                    }

                    const article = doc.data();
                    const editorContent = document.getElementById('editorContent');
                    
                    editorContent.innerHTML = `
                        <h2>Edit Article</h2>
                        <form id="articleForm" onsubmit="saveArticle(event)">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="articleId">Article ID *</label>
                                    <input type="text" id="articleId" value="${articleId}" readonly disabled>
                                </div>
                                <div class="form-group">
                                    <label for="category">Category *</label>
                                    <select id="category" required>
                                        <option value="playwright" ${article.category === 'playwright' ? 'selected' : ''}>Playwright & Test Automation</option>
                                        <option value="history" ${article.category === 'history' ? 'selected' : ''}>Ancient History Insights</option>
                                        <option value="politics" ${article.category === 'politics' ? 'selected' : ''}>Politics & Finance</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="readTime">Read Time *</label>
                                    <input type="text" id="readTime" required value="${article.readTime}">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="title">Article Title *</label>
                                <input type="text" id="title" required value="${article.title}">
                            </div>

                            <div class="form-group">
                                <label for="excerpt">Excerpt (Short Description) *</label>
                                <textarea id="excerpt" rows="3" required>${article.excerpt}</textarea>
                            </div>

                            <div class="form-group">
                                <label for="content">Article Content (HTML) *</label>
                                <textarea id="content" required>${article.content}</textarea>
                            </div>

                            <div class="editor-actions">
                                <button type="button" class="btn btn-secondary" onclick="previewArticle()">Preview</button>
                                <button type="button" class="btn btn-danger" onclick="deleteArticle('${articleId}')">Delete Article</button>
                                <button type="submit" class="btn btn-success">Update Article</button>
                            </div>
                        </form>

                        <div id="previewSection" class="preview-section" style="display: none;">
                            <h3>Preview</h3>
                            <div class="preview-content" id="previewContent"></div>
                        </div>
                    `;

                    // Highlight selected article in sidebar
                    document.querySelectorAll('.article-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    event.target.closest('.article-item')?.classList.add('active');
                })
                .catch((error) => {
                    console.error('Error loading article:', error);
                    showAlert('Error loading article: ' + error.message, 'danger');
                });
        }

        // Preview article
        function previewArticle() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const readTime = document.getElementById('readTime').value;

            const previewSection = document.getElementById('previewSection');
            const previewContent = document.getElementById('previewContent');

            previewContent.innerHTML = `
                <h1>${title}</h1>
                <div class="article-meta">
                    <span>📅 ${date}</span>
                    <span>⏱️ ${readTime}</span>
                </div>
                <div style="margin-top: 2rem;">
                    ${content}
                </div>
            `;

            previewSection.style.display = 'block';
            previewSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Save article (create or update)
        function saveArticle(event) {
            event.preventDefault();

            const articleId = currentArticleId || document.getElementById('articleId').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const readTime = document.getElementById('readTime').value.trim();
            const excerpt = document.getElementById('excerpt').value.trim();
            const content = document.getElementById('content').value.trim();
            const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            if (!articleId || !title || !category || !readTime || !excerpt || !content) {
                showAlert('Please fill in all required fields!', 'danger');
                return;
            }

            const articleData = {
                title: title,
                category: category,
                readTime: readTime,
                excerpt: excerpt,
                content: content,
                date: date,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (!currentArticleId) {
                articleData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            }

            db.collection('articles').doc(articleId).set(articleData, { merge: true })
                .then(() => {
                    showAlert(currentArticleId ? 'Article updated successfully!' : 'Article published successfully!', 'success');
                    loadArticles();
                    
                    if (!currentArticleId) {
                        clearForm();
                    }
                })
                .catch((error) => {
                    console.error('Error saving article:', error);
                    showAlert('Error saving article: ' + error.message, 'danger');
                });
        }

        // Delete article
        function deleteArticle(articleId) {
            if (!confirm('Are you sure you want to delete this article? This action cannot be undone.')) {
                return;
            }

            db.collection('articles').doc(articleId).delete()
                .then(() => {
                    showAlert('Article deleted successfully!', 'success');
                    loadArticles();
                    
                    const editorContent = document.getElementById('editorContent');
                    editorContent.innerHTML = `
                        <div class="empty-state">
                            <h3>Article Deleted</h3>
                            <p>The article has been removed. Click "+ New Article" to create a new one.</p>
                        </div>
                    `;
                })
                .catch((error) => {
                    console.error('Error deleting article:', error);
                    showAlert('Error deleting article: ' + error.message, 'danger');
                });
        }

        // Clear form
        function clearForm() {
            document.getElementById('articleForm')?.reset();
            document.getElementById('previewSection').style.display = 'none';
        }

        // Initialize
        window.onload = function() {
            loadArticles();
            document.getElementById('recentViews').textContent = 'Active';
        };
    </script>
</body>
</html>
